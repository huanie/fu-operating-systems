[build]
target = "armv4t-none-eabi"

[target.armv4t-none-eabi]
rustflags = [
    "-C", "link-arg=-Tkernel.lds",
    "-C", "link-arg=--gc-sections",
    "-C", "link-arg=--nmagic",              # No page alignment
    "-C", "link-arg=--strip-all",           # Strip all symbols
    "-C", "no-redzone",
]

[unstable]
build-std = ["core"]
build-std-features = ["compiler-builtins-mem"]