[package]
name = "freedumbs-os"
version = "0.1.0"
edition = "2024"

[[bin]]
path = "src/main.rs"
name = "kernel"
test = false
bench = false

[dependencies]
ringbuffer = { version = "0.16.0", default-features = false }
ufmt = "0.2.0"

[profile.dev]
panic = "abort"
lto = "thin"
opt-level = "z"
strip = true
overflow-checks = false

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
strip = true
overflow-checks = false
